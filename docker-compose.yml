name: symds-poc

# Startup chain (all automatic with `docker compose up -d`):
#   mssql -> mssql-init (restore .bak twice) -> sym-source -> sym-config (load sync config) -> sym-target (registers + initial load)
x-sqlserver: &sqlserver
  image: mcr.microsoft.com/mssql/server:2022-latest
  platform: linux/amd64

services:
  mssql:
    <<: *sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    stop_grace_period: 60s      # let SQL Server shut down cleanly (default 10s force-kills it)
    ports: ["${MSSQL_PORT:-14330}:1433"]
    volumes:
      - mssql-data:/var/opt/mssql
      - ./data:/backup:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # one-shot: restore AdventureWorksLT2022 twice (AW_Source / AW_Target), create logins. Idempotent.
  mssql-init:
    <<: *sqlserver
    depends_on:
      mssql: { condition: service_healthy }
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      SYMDS_DB_PASSWORD: ${SYMDS_DB_PASSWORD}
      MONITOR_RO_PASSWORD: ${MONITOR_RO_PASSWORD}
    volumes:
      - ./mssql:/init:ro
    entrypoint: ["/bin/bash", "/init/init.sh"]
    restart: "no"

  sym-source:
    image: jumpmind/symmetricds:3.16
    depends_on:
      mssql-init: { condition: service_completed_successfully }
    ports: ["${SYM_SOURCE_PORT:-41415}:31415"]
    # the image has sh but no bash; start-node.sh renders the engine file from the template + env password, then runs sym
    command: ["/bin/sh", "/symds/start-node.sh", "source-000"]
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx1g"
      SYMDS_DB_PASSWORD: ${SYMDS_DB_PASSWORD}
    volumes:
      - ./symds/start-node.sh:/symds/start-node.sh:ro
      - ./symds/engines:/symds/engines:ro

  # one-shot: load the sync configuration into AW_Source once the source node is up
  sym-config:
    <<: *sqlserver
    depends_on:
      sym-source: { condition: service_started }
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      FORCE: ${FORCE_CONFIG:-}
    volumes:
      - ./tools:/tools:ro
      - ./symds/config:/config:ro
    entrypoint: ["/bin/bash", "/tools/load-config.sh"]
    restart: "no"

  sym-target:
    image: jumpmind/symmetricds:3.16
    depends_on:
      sym-config: { condition: service_completed_successfully }
    ports: ["${SYM_TARGET_PORT:-41416}:31415"]
    command: ["/bin/sh", "/symds/start-node.sh", "target-001"]
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Xmx1g"
      SYMDS_DB_PASSWORD: ${SYMDS_DB_PASSWORD}
    volumes:
      - ./symds/start-node.sh:/symds/start-node.sh:ro
      - ./symds/engines:/symds/engines:ro

  # SymmetricDS server for sync pairs created in the monitor UI ("Sync jobs" > New sync). Idle until the UI writes engine files.
  sym-runtime:
    image: jumpmind/symmetricds:3.16
    command: ["/bin/sh", "/symds/runtime-supervisor.sh"]
    restart: unless-stopped
    ports: ["${RUNTIME_PORT:-41417}:31415"]
    environment:
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - ./symds/runtime-supervisor.sh:/symds/runtime-supervisor.sh:ro
      - runtime-engines:/opt/symmetric-ds/engines

  monitor:
    build: ./monitor
    depends_on:
      mssql-init: { condition: service_completed_successfully }
    # bound to this PC only by default: the UI can write to databases. Set MONITOR_BIND=0.0.0.0 to expose it deliberately.
    ports: ["${MONITOR_BIND:-127.0.0.1}:${MONITOR_PORT:-18080}:8080"]
    restart: unless-stopped
    environment:
      MSSQL_HOST: mssql
      MONITOR_USER: monitor_ro            # read-only login used for the built-in "demo" pair
      MONITOR_RO_PASSWORD: ${MONITOR_RO_PASSWORD}
      MONITOR_ADMIN_USER: ${MONITOR_ADMIN_USER:-admin}
      MONITOR_ADMIN_PASSWORD: ${MONITOR_ADMIN_PASSWORD}
      MONITOR_SECRET: ${MONITOR_SECRET:-}
      RUNTIME_ENGINES_DIR: /runtime/engines
      RUNTIME_SYNC_HOST: sym-runtime
    volumes:
      - monitor-data:/data                 # saved connections (passwords encrypted), sync pairs, audit log
      - runtime-engines:/runtime/engines   # engine files for sym-runtime

  # optional second SQL Server instance to try syncing between two servers: docker compose --profile extra-sql up -d mssql2
  mssql2:
    <<: *sqlserver
    profiles: ["extra-sql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    stop_grace_period: 60s
    ports: ["${MSSQL2_PORT:-14331}:1433"]
    volumes:
      - mssql2-data:/var/opt/mssql

  # helper container for tests/maintenance:  docker compose run --rm tools <parity|smoke|chaos|chaos-repair|status|wait-parity|drop-dbs>
  tools:
    <<: *sqlserver
    profiles: ["tools"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - ./tools:/tools:ro
      - ./symds/config:/config:ro
      - ./data:/backup:ro
    entrypoint: ["/bin/bash", "/tools/run.sh"]

volumes:
  mssql-data:
  mssql2-data:
  monitor-data:
  runtime-engines:
